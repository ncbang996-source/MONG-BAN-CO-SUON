name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Kiểm tra dựng bản vẽ mẫu
        run: python tests/smoke.py
      - name: Kiểm tra giao diện (tab 3D) + chụp màn hình
        run: python tests/ui_smoke.py
      - name: Gửi ảnh 1
        run: python tests/shot_annot.py 2_3d_toan_mong.png
      - name: Gửi ảnh 2
        run: python tests/shot_annot.py 4_3d_cat_1_4.png
      - name: Gửi ảnh 3
        run: python tests/shot_annot.py 5_3d_phong_to.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anh-giao-dien
          path: shots/
      - name: Đóng gói exe
        run: pyinstaller --noconfirm VE_MONGBANCOSUON.spec
      - uses: actions/upload-artifact@v4
        with:
          name: VE_MONGBANCOSUON-exe
          path: dist/VE_MONGBANCOSUON.exe
